name: desktop-ci

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-*.yml']

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Frontend typecheck and build
        run: npm run build

      - name: Rust fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test
